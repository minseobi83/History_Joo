<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<title>한국사 인물 맞추기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=4" />
</head>
<body>
  <div id="app">

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen active">
      <div class="card start-card">
        <h1 class="logo">🏛️ 한국사 인물 맞추기</h1>
        <p class="subtitle">힌트를 보고 역사 속 인물을 맞혀 보세요!</p>

        <div class="option-group">
          <h2>모드를 골라요</h2>
          <div id="mode-buttons" class="chip-row">
            <button class="chip selected" data-mode="인물">🙋 인물 맞추기</button>
            <button class="chip" data-mode="사건">📜 사건 맞추기</button>
          </div>
        </div>

        <div class="option-group">
          <h2>난이도를 골라요</h2>
          <div id="level-buttons" class="chip-row">
            <button class="chip" data-level="basic">🌱 초중등(기본)</button>
            <button class="chip selected" data-level="hard">🔥 고등(심화)</button>
          </div>
        </div>

        <div class="option-group">
          <h2>시대를 골라요</h2>
          <div id="era-buttons" class="chip-row"></div>
        </div>

        <div class="option-group">
          <h2>문제 수를 골라요</h2>
          <div id="count-buttons" class="chip-row">
            <button class="chip" data-count="5">5문제</button>
            <button class="chip selected" data-count="10">10문제</button>
            <button class="chip" data-count="15">15문제</button>
          </div>
        </div>

        <button id="btn-start" class="btn-primary">🚀 퀴즈 시작!</button>

        <div id="best-score-box" class="best-score-box" hidden>
          <span id="best-score-text"></span>
        </div>
      </div>
    </section>

    <!-- 게임 화면 -->
    <section id="screen-game" class="screen">
      <div class="topbar">
        <div class="topbar-item" id="progress-text">문제 1/10</div>
        <div class="topbar-item" id="lives-box">❤️❤️❤️</div>
        <div class="topbar-item" id="score-box">점수 0</div>
      </div>

      <div class="card quiz-card">
        <h2 class="quiz-title" id="quiz-title">이 사람은 누구일까요?</h2>

        <div id="hint-list" class="hint-list"></div>

        <button id="btn-more-hint" class="btn-secondary">💡 힌트 더 보기</button>

        <div id="choices" class="choices"></div>

        <div id="feedback-box" class="feedback-box" hidden>
          <p id="feedback-text"></p>
          <p id="fact-text" class="fact-text"></p>
          <button id="btn-next" class="btn-primary">다음 문제 ▶</button>
        </div>
      </div>
    </section>

    <!-- 결과 화면 -->
    <section id="screen-end" class="screen">
      <div class="card end-card">
        <h1 id="end-medal" class="end-medal">🏅</h1>
        <h2 id="end-title">수고했어요!</h2>
        <p id="end-summary" class="end-summary"></p>
        <p id="end-score" class="end-score"></p>
        <p id="end-best" class="end-best"></p>
        <div class="end-btn-row">
          <button id="btn-restart" class="btn-primary">🔁 다시 도전하기</button>
          <button id="btn-home" class="btn-secondary">🏠 처음으로</button>
        </div>
      </div>
    </section>

  </div>

  <script src="js/data.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
